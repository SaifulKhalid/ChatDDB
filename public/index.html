<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrototypeChatBot</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New chat</span>
        </button>
        <button id="toggle-sidebar" class="icon-btn" title="Collapse sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-footer">
        <div class="model-selector-wrap">
          <label for="model-select" class="model-label">Model</label>
          <select id="model-select" class="model-select"></select>
        </div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main id="main">
      <header class="chat-header">
        <button id="open-sidebar" class="icon-btn hidden" title="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <h1 id="chat-title" class="chat-title">New chat</h1>
      </header>

      <div id="messages" class="messages">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">🤖</div>
          <h2>How can I help you today?</h2>
          <p>Ask anything, or upload an image or PDF to get started.</p>
        </div>
      </div>

      <div class="composer">
        <div id="attachments-preview" class="attachments-preview"></div>
        <div class="composer-row">
          <button id="attach-btn" class="icon-btn attach-btn" title="Attach file (image or PDF)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" multiple accept="image/*,application/pdf" hidden />
          <textarea id="input" class="input" rows="1" placeholder="Send a message..."></textarea>
          <button id="send-btn" class="send-btn" title="Send" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
          <button id="stop-btn" class="stop-btn hidden" title="Stop generating">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
        <p class="composer-hint">PrototypeChatBot can make mistakes. Powered by AgentRouter, Groq & Gemini.</p>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
