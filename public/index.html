<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrototypeChatBot</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New chat</span>
        </button>
        <button id="toggle-sidebar" class="icon-btn" title="Collapse sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-footer">
        <div class="model-selector-wrap">
          <label for="model-select" class="model-label">Model</label>
          <select id="model-select" class="model-select"></select>
        </div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main id="main">
      <header class="chat-header">
        <button id="open-sidebar" class="icon-btn hidden" title="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <h1 id="chat-title" class="chat-title">New chat</h1>
        <!-- User query pill -->
        <div id="user-query-pill" class="user-query-pill hidden">
          <span class="user-query-pill-label">Ask</span>
          <span id="user-query-text" class="user-query-text"></span>
        </div>
        <div class="header-actions">
          <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle color theme">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <div id="messages" class="messages">
        <div class="messages-inner">
          <div id="welcome" class="welcome">
            <div class="welcome-icon">🤖</div>
            <h2>How can I help you today?</h2>
            <p>Ask anything, or upload an image or PDF to get started.</p>
            <div class="welcome-suggestions">
              <button class="welcome-suggestion" data-prompt="Explain quantum computing in simple terms">Explain quantum computing</button>
              <button class="welcome-suggestion" data-prompt="Write a Python function to sort a list">Write Python code</button>
              <button class="welcome-suggestion" data-prompt="What is the meaning of life?">Philosophical question</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Floating pill composer -->
      <div class="composer-wrap">
        <div class="composer">
          <div id="attachments-preview" class="attachments-preview"></div>
          <div class="composer-row">
            <button id="attach-btn" class="icon-btn attach-btn" title="Attach file (image or PDF)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="file-input" multiple accept="image/*,application/pdf" hidden />
            <textarea id="input" class="input" rows="1" placeholder="Ask anything"></textarea>

            <!-- Model dropdown with status dot -->
            <div id="composer-model-wrap" class="composer-model-wrap">
              <button id="composer-model-btn" class="composer-model-btn" title="Select model">
                <span class="model-status-dot"></span>
                <span id="composer-model-label"></span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div id="composer-model-dropdown" class="composer-model-dropdown hidden"></div>
            </div>

            <!-- Prompt enhancer (sparkle) -->
            <button id="sparkle-btn" class="icon-btn sparkle-btn" title="Enhance prompt">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z"/><line x1="18" y1="16" x2="20" y2="20"/><line x1="8" y1="16" x2="6" y2="20"/></svg>
            </button>

            <button id="send-btn" class="send-btn" title="Send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
            <button id="stop-btn" class="stop-btn hidden" title="Stop generating">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scroll-to-bottom floating button -->
  <button id="scroll-bottom-btn" class="scroll-bottom-btn hidden" title="Scroll to bottom">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
